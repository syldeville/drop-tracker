<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drops</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff; --ink: #000000; --muted: #6e6a70; --line: #e7e3e8; --tile: #f3eef2; --accent: #6b2d5c;
    --display: 'Syne', -apple-system, system-ui, sans-serif;
    --sans: 'Hanken Grotesk', -apple-system, system-ui, sans-serif;
    --gutter: 16px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #000000; --ink: #f5f2f4; --muted: #9a949c; --line: #2a262a; --tile: #151215; --accent: #e3b3d3; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--sans);
    padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Masthead: the one loud thing on the page */
  header { position: relative; padding: calc(env(safe-area-inset-top) + 20px) var(--gutter) 12px; }

  /* Notification bell + popover */
  .bell { position: absolute; top: calc(env(safe-area-inset-top) + 14px); right: calc(var(--gutter) - 10px);
    width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink); }
  .bell svg { width: 24px; height: 24px; transform-origin: 50% 3px; }
  .bell .fill { fill: transparent; transition: fill .25s; }
  .bell[aria-pressed=true] .fill { fill: currentColor; }
  .bell::after { content: ''; position: absolute; top: 11px; right: 11px; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); transform: scale(0); transition: transform .3s cubic-bezier(.3, 1.6, .5, 1); }
  .bell[aria-pressed=true]::after { transform: scale(1); }
  .bell.ring svg { animation: ring .8s ease-in-out; }
  @keyframes ring { 0%, 100% { transform: rotate(0) } 15% { transform: rotate(22deg) } 30% { transform: rotate(-18deg) }
    45% { transform: rotate(12deg) } 60% { transform: rotate(-8deg) } 75% { transform: rotate(4deg) } }
  .pop { position: absolute; z-index: 4; top: calc(env(safe-area-inset-top) + 58px); right: var(--gutter); width: min(270px, calc(100vw - 2 * var(--gutter)));
    padding: 16px; background: var(--paper); border: 1px solid var(--ink); font-size: 13px; color: var(--muted);
    transform-origin: calc(100% - 22px) 0; animation: pop .22s ease-out; }
  .pop[hidden] { display: none; }
  .pop strong { display: block; font: 700 17px/1.2 var(--display); color: var(--ink); margin-bottom: 4px; }
  .pop button { margin-top: 12px; font-weight: 600; color: var(--accent); }
  @keyframes pop { from { opacity: 0; transform: scale(.9) translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .bell.ring svg, .pop { animation: none; } }
  .masthead { font: 800 clamp(48px, 16vw, 96px)/0.9 var(--display); letter-spacing: -0.06em; margin: 0 0 0 -0.03em; }
  .dateline { margin-top: 14px; padding-top: 10px;
    border-top: 1px solid var(--ink); font-size: 13px; color: var(--muted); }

  /* Brand strip */
  nav.brands { position: sticky; top: 0; z-index: 2; background: var(--paper);
    padding-top: env(safe-area-inset-top); border-bottom: 1px solid var(--line); }
  .brand-row { display: flex; gap: 18px; overflow-x: auto; padding: 12px var(--gutter); scrollbar-width: none; }
  .brand-row::-webkit-scrollbar { display: none; }
  .brand-row button { flex: none; font: 500 14px/1.2 var(--display); color: var(--muted); padding: 4px 0; white-space: nowrap;
    border-bottom: 1.5px solid transparent; }
  .brand-row button[aria-pressed=true] { color: var(--ink); font-weight: 700; border-color: var(--accent); }

  main { padding: 0 var(--gutter); }
  .notice { font-size: 13px; color: var(--muted); margin: 14px 0 0; }

  h2 { display: flex; justify-content: space-between; align-items: baseline; margin: 32px 0 14px;
    font: 700 19px/1.15 var(--display); letter-spacing: -0.02em; }
  h2 span { font: 400 13px var(--sans); color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px 12px; margin-top: 20px; }
  h2 + .grid { margin-top: 0; }
  .item { color: inherit; text-decoration: none; display: block; min-width: 0; }
  .photo { aspect-ratio: 3 / 4; background: var(--tile); overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo.text { display: flex; align-items: flex-end; padding: 10px; font: 600 15px/1.2 var(--display); }
  .item .brand { font: 600 13px/1.2 var(--display); margin-top: 9px; }
  .item .title { font-size: 13px; line-height: 1.35; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .meta { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .item .price { color: var(--ink); font-weight: 600; }
  .empty { padding: 56px 0; max-width: 30ch; }
  .empty p:first-child { font: 700 20px/1.2 var(--display); margin: 0 0 8px; color: var(--ink); }
  .empty p + p { margin: 0; color: var(--muted); }

  /* Bottom tab bar */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; display: flex;
    padding: 6px var(--gutter) calc(6px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--paper) 88%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-top: 1px solid var(--line); }
  .tabbar button { flex: 1; padding: 10px 0; font: 500 15px/1 var(--display); color: var(--muted); }
  .tabbar button[aria-selected=true] { color: var(--ink); font-weight: 700; }
  .tabbar button[aria-selected=true]::after { content: ''; display: block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); margin: 7px auto 0; }
</style>
</head>
<body>
<header>
  <h1 class="masthead">Drops</h1>
  <button class="bell" id="bell" aria-pressed="false" aria-label="Notifications" aria-controls="pop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path class="fill" d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
    </svg>
  </button>
  <div class="pop" id="pop" role="status" hidden></div>
  <div class="dateline" id="checked">Loading…</div>
</header>
<nav class="brands" aria-label="Brands"><div class="brand-row" id="brands"></div></nav>
<main>
  <p class="notice" id="notice" hidden></p>
  <div id="list"></div>
</main>
<div class="tabbar" role="tablist">
  <button role="tab" aria-selected="true" data-tab="drops">Shops</button>
  <button role="tab" aria-selected="false" data-tab="vinted">Vinted</button>
  <button role="tab" aria-selected="false" data-tab="ebay">eBay</button>
</div>

<script>
const VAPID_PUBLIC = 'BKbdPatCQOooWLbwDa80TrJdYou5PkGeIshFQsHgvgGXU6p3ggj7c59Il7JjINbHXGN0XZmIRi99oqVVryrogew';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dayName = iso => new Date(iso).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

fetch('drops.json', { cache: 'no-store' }).then(r => r.json()).then(d => {
  const t = new Date(d.checked);
  const today = t.toDateString() === new Date().toDateString();
  $('checked').textContent = `Checked ${today ? 'today' : dayName(d.checked)} at ${t.toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit' })}`;
  let tab = 'drops', brand = null;

  const card = x => {
    // Shopify images accept a width param; Vinted's are signed and already small.
    const img = x.image && (tab === 'drops' ? x.image + '&width=500' : x.image);
    const photo = img ? `<div class="photo"><img src="${esc(img)}" loading="lazy" alt=""></div>`
                      : `<div class="photo text">${esc(x.title)}</div>`;
    const meta = [x.price && `<span class="price">${tab === 'drops' ? esc(x.cur || '£') : '£'}${esc(x.price)}</span>`, x.detail && esc(x.detail)].filter(Boolean).join(', ');
    return `<a class="item" href="${esc(x.url)}" target="_blank" rel="noopener">${photo}
      <div class="brand">${esc(x.brand)}</div>${img ? `<div class="title">${esc(x.title)}</div>` : ''}
      ${meta ? `<div class="meta">${meta}</div>` : ''}</a>`;
  };

  const render = () => {
    document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
    document.querySelectorAll('[data-brand]').forEach(b => b.setAttribute('aria-pressed', (b.dataset.brand || null) === brand));

    if (tab === 'ebay' && !d.ebay) {
      $('notice').hidden = true;
      $('list').innerHTML = '<div class="empty"><p>Under construction.</p><p>eBay listings for your brands are coming soon.</p></div>';
      return;
    }
    const down = Object.entries(d.status).filter(([b, s]) => (!brand || b === brand) && (tab === 'drops' ? !s.ok : s[tab] === false)).map(([b]) => b);
    $('notice').hidden = !down.length;
    $('notice').textContent = `Couldn’t check ${down.join(' or ')}${tab === 'vinted' ? ' on Vinted' : tab === 'ebay' ? ' on eBay' : ''} today. It’ll try again tomorrow.`;

    if (tab === 'drops' && brand && d.status[brand]?.noShop) {
      $('list').innerHTML = `<div class="empty"><p>No shop to check.</p><p>${esc(brand)} doesn’t sell clothes on its own website. Look in the Vinted tab instead.</p></div>`;
      return;
    }
    const items = (d[tab] || []).filter(x => !brand || x.brand === brand);
    if (!items.length) {
      const who = brand || 'your brands';
      $('list').innerHTML = `<div class="empty"><p>Nothing new yet.</p><p>New ${tab === 'drops' ? 'arrivals' : tab === 'ebay' ? 'eBay listings' : 'Vinted listings'} from ${esc(who)} show up here after the daily check.</p></div>`;
      return;
    }
    if (tab !== 'drops') { $('list').innerHTML = `<div class="grid">${items.map(card).join('')}</div>`; return; }
    const days = {};
    for (const x of items) (days[dayName(x.found)] ||= []).push(x);
    $('list').innerHTML = Object.entries(days).map(([day, xs]) =>
      `<h2>${esc(day)}<span>${xs.length} new</span></h2><div class="grid">${xs.map(card).join('')}</div>`).join('');
  };

  $('brands').innerHTML = ['', ...Object.keys(d.status)].map(b => `<button data-brand="${esc(b)}">${esc(b || 'All')}</button>`).join('');
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); scrollTo(0, 0); });
  $('brands').onclick = e => { const b = e.target.closest('button'); if (b) { brand = b.dataset.brand || null; render(); } };
  render();
}).catch(() => $('checked').textContent = 'Couldn’t load drops. Close and reopen the app to try again.');

// Notifications: iOS only allows these once the page is added to the home screen.
const pushable = 'serviceWorker' in navigator && 'PushManager' in window;
if (pushable) {
  navigator.serviceWorker.register('sw.js');
  $('bell').setAttribute('aria-pressed', Notification.permission === 'granted');
}
let sub = null;
const showPop = (title, text, copy) => {
  $('pop').innerHTML = `<strong>${title}</strong>${text}${copy ? '<button id="copy">Copy setup code</button>' : ''}`;
  $('pop').hidden = false;
  if (copy) $('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(JSON.stringify(sub)); $('copy').textContent = 'Copied'; }
    catch { $('copy').outerHTML = `<textarea readonly style="width:100%;height:80px;margin-top:10px;font:11px ui-monospace,monospace">${esc(JSON.stringify(sub))}</textarea>`; }
  };
};
$('bell').onclick = async e => {
  e.stopPropagation();
  if (!$('pop').hidden) { $('pop').hidden = true; return; }
  if (!pushable) return showPop('Add to Home Screen first', 'In Safari, tap Share, then Add to Home Screen. Open Drops from there to turn on notifications.');
  if (await Notification.requestPermission() !== 'granted') return showPop('Notifications are off', 'Turn them on in Settings, Notifications, Drops, then tap the bell again.');
  const reg = await navigator.serviceWorker.ready;
  const key = Uint8Array.from(atob(VAPID_PUBLIC.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
  sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
  $('bell').setAttribute('aria-pressed', true);
  $('bell').classList.remove('ring'); void $('bell').offsetWidth; $('bell').classList.add('ring');
  showPop('You’re on the list', 'You’ll get a notification when something new drops. First time on this phone? Copy the setup code into the PUSH_SUBSCRIPTION secret on GitHub.', true);
};
document.addEventListener('click', e => { if (!$('pop').contains(e.target)) $('pop').hidden = true; });
</script>
</body>
</html>
