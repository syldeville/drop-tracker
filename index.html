<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drops</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f1ea">
<style>
  :root { --bg: #f6f1ea; --fg: #1d1a17; --muted: #8a8177; --card: #fff; --line: #e6ddd2; --accent: #c2410c; --bad: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141210; --fg: #f3ede6; --muted: #948b80; --card: #1f1c19; --line: #2e2a26; --accent: #fb923c; --bad: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 -apple-system, system-ui, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  h1 { font: 700 34px/1 Georgia, serif; letter-spacing: -0.02em; margin: 8px 0 4px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .chip { width: auto; margin: 0; font-size: 12px; font-weight: 400; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  .chip[aria-pressed=true] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .chip.bad { color: var(--bad); }
  button { font: inherit; font-weight: 600; width: 100%; padding: 12px; border: 0; border-radius: 12px; background: var(--fg); color: var(--bg); margin-bottom: 20px; }
  textarea { width: 100%; height: 110px; font: 11px ui-monospace, monospace; margin-bottom: 20px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 24px 0 8px; }
  a.item { display: flex; gap: 12px; align-items: center; padding: 10px; margin-bottom: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; color: inherit; text-decoration: none; }
  a.item img, a.item .ph { width: 64px; height: 80px; object-fit: cover; border-radius: 8px; background: var(--line); flex: none; }
  .brand { font-size: 12px; font-weight: 600; color: var(--accent); }
  .title { font-weight: 500; }
  .price { font-size: 13px; color: var(--muted); }
  .tabs { display: flex; gap: 4px; padding: 4px; background: var(--line); border-radius: 12px; margin-bottom: 16px; }
  .tabs button { margin: 0; padding: 8px; background: none; color: var(--muted); border-radius: 9px; }
  .tabs button[aria-selected=true] { background: var(--card); color: var(--fg); }
  .detail { font-size: 13px; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<h1>Drops</h1>
<div class="meta" id="meta">Loading…</div>
<button id="notify" hidden>Turn on notifications</button>
<textarea id="sub" hidden readonly></textarea>
<div class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-tab="drops">Shops</button>
  <button role="tab" aria-selected="false" data-tab="vinted">Vinted</button>
</div>
<div class="chips" id="chips"></div>
<div id="list"></div>

<script>
const VAPID_PUBLIC = 'BKbdPatCQOooWLbwDa80TrJdYou5PkGeIshFQsHgvgGXU6p3ggj7c59Il7JjINbHXGN0XZmIRi99oqVVryrogew';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

fetch('drops.json', { cache: 'no-store' }).then(r => r.json()).then(d => {
  $('meta').textContent = 'Last checked ' + new Date(d.checked).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
  let tab = 'drops', brand = null;
  const render = () => {
    document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
    $('chips').innerHTML = [[null, {}], ...Object.entries(d.status)].map(([b, s]) => {
      const down = b && (tab === 'drops' ? !s.ok : s.vinted === false);
      return `<button class="chip ${down ? 'bad' : ''}" aria-pressed="${b === brand}" data-brand="${esc(b ?? '')}">${esc(b ?? 'All')}${down ? ' · unavailable' : ''}</button>`;
    }).join('');
    const items = (d[tab] || []).filter(x => !brand || x.brand === brand);
    if (!items.length) { $('list').innerHTML = '<p class="empty">Nothing new yet. Check back tomorrow.</p>'; return; }
    let day = '';
    $('list').innerHTML = items.map(x => {
      const dd = new Date(x.found).toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' });
      const head = tab === 'drops' && dd !== day ? `<h2>${esc(day = dd)}</h2>` : '';
      // Shopify images accept a width param; Vinted's are signed and already small.
      const img = x.image && (tab === 'drops' ? x.image + '&width=200' : x.image);
      return head + `<a class="item" href="${esc(x.url)}" target="_blank" rel="noopener">
        ${img ? `<img src="${esc(img)}" loading="lazy" alt="">` : '<div class="ph"></div>'}
        <div><div class="brand">${esc(x.brand)}</div><div class="title">${esc(x.title)}</div>
        ${x.detail ? `<div class="detail">${esc(x.detail)}</div>` : ''}
        ${x.price ? `<div class="price">£${esc(x.price)}</div>` : ''}</div></a>`;
    }).join('');
  };
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  $('chips').onclick = e => { const c = e.target.closest('.chip'); if (c) { brand = c.dataset.brand || null; render(); } };
  render();
}).catch(() => $('meta').textContent = 'Couldn’t load drops.');

// Notifications: iOS only allows these once the page is added to the home screen.
if ('serviceWorker' in navigator && 'PushManager' in window) {
  navigator.serviceWorker.register('sw.js');
  $('notify').hidden = false;
  $('notify').onclick = async () => {
    if (await Notification.requestPermission() !== 'granted') return alert('Notifications were blocked. Enable them in Settings.');
    const reg = await navigator.serviceWorker.ready;
    const key = Uint8Array.from(atob(VAPID_PUBLIC.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
    $('sub').value = JSON.stringify(sub);
    $('sub').hidden = false;
    $('sub').select();
    $('notify').textContent = 'Copy the text below into the PUSH_SUBSCRIPTION secret';
  };
}
</script>
</body>
</html>
